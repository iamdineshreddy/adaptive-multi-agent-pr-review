[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adaptive-review"
version = "0.1.0"
description = "Adaptive Multi-Agent AI System for GitHub Pull Request Review"
requires-python = ">=3.11,<4"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "httpx>=0.27,<1",
    "structlog>=24.1,<25",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-httpx>=0.30,<1",
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
]
db = [
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.29",
    "alembic>=1.13,<2",
    "pgvector>=0.3",
]
queue = [
    "celery[redis]>=5.4,<6",
    "redis>=5.0,<6",
]
llm = [
    "openai>=1.30",
    "anthropic>=0.25",
]
orchestration = [
    "langgraph>=0.6,<2",
]
ml = [
    "lightgbm>=4.3",
    "numpy>=1.26",
    "scikit-learn>=1.5",
]
monitoring = [
    "prometheus-client>=0.21",
    "langfuse>=2.30",
]
all = ["adaptive-review[db,llm,queue,ml,monitoring,orchestration]"]

[project.scripts]
adaptive-review = "app.main:create_app"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["celery", "celery.*", "kombu", "kombu.*", "billiard", "vine"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# LangGraph ships partially-typed langchain-core deps; orchestration logic is
# the unit-tested surface while the graph library itself is treated as an
# external dependency, not a strict-mypy target.
module = ["langgraph", "langgraph.*", "langchain.*", "langsmith.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Celery's task decorator is untyped; the tasks are thin sync wrappers over
# typed async cores (app.queue.tasks), which are the actual unit-tested surface.
module = ["app.queue.tasks", "app.queue.celery_app", "app.queue.agent_tasks"]
disable_error_code = ["untyped-decorator", "no-untyped-def", "no-any-return"]

[[tool.mypy.overrides]]
module = ["app.orchestrator.tasks"]
disable_error_code = ["untyped-decorator", "no-untyped-def", "no-any-return"]

[[tool.mypy.overrides]]
# LightGBM/numpy ship no strict type stubs; the adaptive training path imports
# them lazily inside guarded functions and treats them as external deps.
module = ["lightgbm", "numpy"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# LangGraph's add_node/add_conditional_edges overloads reject explicitly-typed
# OrchestrationState node callables; the topology is proven by the orchestrator
# graph tests, so these wiring calls skip mypy's overload resolution.
module = ["app.orchestrator.graph"]
disable_error_code = ["call-overload"]
